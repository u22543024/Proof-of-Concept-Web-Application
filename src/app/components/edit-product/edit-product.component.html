
<div class="container">
    <h2>Edit Product</h2>
  
    <div class="form-group">
      <label>Product Name:</label>
      <input [(ngModel)]="product.name" placeholder="Product Name">
    </div>
  
    <div class="form-group">
      <label>Price:</label>
      <input [(ngModel)]="product.price" placeholder="Price">
    </div>
  
    <div class="form-group">
      <label>Description:</label>
      <input [(ngModel)]="product.description" placeholder="Description">
    </div>
  
    <div class="button-group">
      <button type="button" class="save-btn" (click)="updateProduct()">Save Changes</button>
      <button type="button" class="cancel-btn" [routerLink]="['/']">Cancel</button>
    </div>
  </div>
